# ============================================================
# API Automation CI Pipeline
# Playwright + TypeScript
# ============================================================

name: API Automation Tests

# ------------------------------------------------------------
# Pipeline triggers
# ------------------------------------------------------------

# Run the pipeline whenever code is pushed to main.
on:
  push:
    branches:
      - main

  # Also run the pipeline when a Pull Request targets main.
  pull_request:
    branches:
      - main


# ------------------------------------------------------------
# Jobs
# ------------------------------------------------------------

jobs:

  api-tests:

    # Maximum time allowed for the complete job.
    timeout-minutes: 30

    # GitHub-hosted Ubuntu machine.
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Setup Node.js
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm


      # ------------------------------------------------------
      # 3. Install project dependencies
      # ------------------------------------------------------

      # npm ci installs dependencies exactly according to
      # package-lock.json and is preferred for CI environments.
      - name: Install dependencies
        run: npm ci


      # ------------------------------------------------------
      # 4. Install Playwright dependencies
      # ------------------------------------------------------

      # The --with-deps option installs Playwright browsers
      # and the required Linux system dependencies.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps


      # ------------------------------------------------------
      # 5. TypeScript validation
      # ------------------------------------------------------

      # This validates the entire TypeScript project without
      # generating JavaScript files.
      - name: TypeScript validation
        run: npx tsc --project tsconfig.json --noEmit


      # ------------------------------------------------------
      # 6. Execute API automation tests
      # ------------------------------------------------------

      # Run only the framework API tests.
      #
      # The old APItestingGETexample.spec.ts file was removed,
      # therefore tests/api contains the actual framework tests.
      - name: Run API tests
        run: npm run test:api


      # ------------------------------------------------------
      # 7. Upload Playwright report
      # ------------------------------------------------------

      # Upload the report even when tests fail so that failures
      # can be investigated from GitHub Actions.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30