# ============================================================
# API Automation CI Pipeline
# Playwright + TypeScript
# ============================================================

name: API Automation Tests

# ------------------------------------------------------------
# Pipeline triggers
# ------------------------------------------------------------

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Allows the workflow to be started manually from GitHub.
  workflow_dispatch:


# ------------------------------------------------------------
# Jobs
# ------------------------------------------------------------

jobs:

  api-tests:

    # Maximum time allowed for the complete job.
    timeout-minutes: 30

    # GitHub-hosted Ubuntu machine.
    runs-on: ubuntu-latest

    # Environment variables required by the framework.
    # Actual values are stored in GitHub Secrets.
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}

    steps:

      # ------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Setup Node.js
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm


      # ------------------------------------------------------
      # 3. Install project dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # ------------------------------------------------------
      # 4. Install Playwright dependencies
      # ------------------------------------------------------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps


      # ------------------------------------------------------
      # 5. TypeScript validation
      # ------------------------------------------------------

      - name: TypeScript validation
        run: npx tsc --project tsconfig.json --noEmit


      # ------------------------------------------------------
      # 6. Execute smoke tests
      # ------------------------------------------------------

      - name: Run API smoke tests
        run: npm run test:smoke


      # ------------------------------------------------------
      # 7. Execute regression tests
      # ------------------------------------------------------

      - name: Run API regression tests
        run: npm run test:regression


      # ------------------------------------------------------
      # 8. Upload Playwright report
      # ------------------------------------------------------

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30